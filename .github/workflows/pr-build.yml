name: pr-build

# Builds the CPU image for both architectures on pull requests that touch it,
# on native runners, and runs a short smoke test. Nothing is pushed and no
# secret is used. (harbor.yml builds and pushes only after the merge, which is
# too late to learn that a lock or pin is broken on arm64.)
on:
  pull_request:
    paths:
      - 'bash/**'
      - '.github/workflows/pr-build.yml'

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: bash
          file: bash/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: mesa-cli:pr

      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash mesa-cli:pr -c '
            set -e
            claude --version
            codex --version
            opencode --version
            goose --version
            agy --version
            gh --version
            duckdb --version
            test -x /home/jovyan/.npm-global/bin/mcp-server-filesystem
            command -v mesa-mcp mesa-ducklake irods-mcp-server gocmd aws ttyd tini
            /opt/mesa/bin/python -c "from importlib.metadata import version as v; print(\"mesa-mcp\", v(\"mesa-mcp\"), \"mesa-ducklake\", v(\"mesa-ducklake\"))"
            /opt/conda/bin/python -c "import duckdb; print(\"duckdb\", duckdb.__version__)"
            /opt/conda/envs/geospatial/bin/python -c "from osgeo import gdal; import pdal, geopandas; print(\"gdal\", gdal.__version__)"
            test -z "$(find /home/jovyan -xdev ! -user jovyan -print -quit)"
          '
