name: harbor

on:
  push:
    branches: main
  schedule:
    # Weekly rebuild (Sunday 00:00 UTC) to pick up upstream package/CLI updates.
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:

  build:
    # Native runner per arch — avoids QEMU emulation (the emulated mamba solve
    # is ~40 min and can OOM). amd64 -> :latest, arm64 -> :arm64 (matches README).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: arm64

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.cyverse.org
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-${{ matrix.platform }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-buildx-

      - name: Build and push bash
        id: docker_build_bash
        uses: docker/build-push-action@v6
        with:
          context: bash
          file: bash/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: harbor.cyverse.org/vice/mesa-cli:${{ matrix.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build_bash.outputs.digest }}
