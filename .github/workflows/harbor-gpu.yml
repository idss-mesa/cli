name: harbor-gpu

# NVIDIA GPU variant (gpu/Dockerfile), layered on the published CPU image.
# Normally built and pushed from a GPU server with `make pull-base build-gpu
# test-gpu push-gpu` (see README "GPU variant"), where it can be smoke-tested on
# a real GPU; this manual workflow is the no-GPU alternative (build + push only).
on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'CPU image tag to layer on'
        required: false
        default: 'latest'
        type: string
      tag:
        description: 'GPU image tag to push'
        required: false
        default: 'gpu'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The CPU base (~8 GB) plus CUDA PyTorch/Ollama layers (~10 GB) far exceed
      # the runner's free disk; reclaim ~25-30 GB before building
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.cyverse.org
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Pin the exact CPU image the GPU layer is built on (recorded in the log)
      - name: Resolve base image digest
        id: base
        env:
          BASE_TAG: ${{ inputs.base_tag || 'latest' }}
        run: |
          digest=$(docker buildx imagetools inspect "harbor.cyverse.org/vice/mesa-cli:${BASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in sha256:*) ;; *) echo "could not resolve harbor.cyverse.org/vice/mesa-cli:${BASE_TAG}" >&2; exit 1 ;; esac
          echo "ref=harbor.cyverse.org/vice/mesa-cli@${digest}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: gpu
          file: gpu/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.ref }}
          tags: harbor.cyverse.org/vice/mesa-cli:${{ inputs.tag || 'gpu' }}
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=min,scope=gpu

      - name: Image digest
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: echo "${DIGEST} (base ${BASE_REF})"
